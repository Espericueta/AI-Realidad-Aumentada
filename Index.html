<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>Tarea 3.2 — AR Giroscopio</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; font-family:'Segoe UI',sans-serif; overflow:hidden; height:100dvh; }
#cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
#three-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }
#hud { position:fixed; inset:0; z-index:10; pointer-events:none; }

/* Start screen */
#start-screen {
  position:fixed; inset:0; z-index:999;
  background:linear-gradient(160deg,#07091a,#0e1a2e 60%,#07091a);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:36px; text-align:center; transition:opacity .7s ease;
}
#start-screen.hidden { opacity:0; pointer-events:none; }
.orb {
  width:100px; height:100px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#6ec6ff,#3b6fd4 50%,#1a2a6c);
  box-shadow:0 0 60px rgba(110,198,255,.4);
  margin-bottom:24px;
  animation:op 3s ease-in-out infinite;
}
@keyframes op{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.s-title { color:#fff; font-size:24px; font-weight:800; margin-bottom:8px; }
.s-sub { color:#6ec6ff; font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px; }
.s-desc { color:rgba(255,255,255,.5); font-size:14px; line-height:1.8; margin-bottom:32px; max-width:280px; }
.s-btn {
  background:linear-gradient(135deg,#6ec6ff,#a78bfa); border:none;
  color:#000; font-size:16px; font-weight:800;
  padding:16px 44px; border-radius:40px; cursor:pointer;
}
.s-btn:active{transform:scale(.95)}
.s-note { color:rgba(255,255,255,.25); font-size:11px; margin-top:14px; line-height:1.6; }

/* Top bar */
.top-bar {
  position:absolute; top:0; left:0; right:0;
  padding:14px 18px 10px;
  background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);
  display:flex; align-items:center; justify-content:space-between;
}
.top-title { color:#fff; font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
.badge {
  background:rgba(110,198,255,.18); border:1px solid rgba(110,198,255,.4);
  color:#6ec6ff; font-size:10px; font-weight:700; letter-spacing:1px; padding:3px 10px; border-radius:20px;
}

/* Crosshair */
.xhair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:52px; height:52px; }
.xh-ring { width:52px; height:52px; border:1.5px solid rgba(110,198,255,.5); border-radius:50%; animation:xhp 2.5s ease-in-out infinite; }
.xh-dot { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:5px; height:5px; background:#6ec6ff; border-radius:50%; }
@keyframes xhp{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.14)}}
.corners { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:140px; height:140px; }
.cor { position:absolute; width:18px; height:18px; border-color:rgba(110,198,255,.4); border-style:solid; }
.cor.tl{top:0;left:0;border-width:2px 0 0 2px}
.cor.tr{top:0;right:0;border-width:2px 2px 0 0}
.cor.bl{bottom:0;left:0;border-width:0 0 2px 2px}
.cor.br{bottom:0;right:0;border-width:0 2px 2px 0}

/* Gyro data strip */
#gyro-strip {
  position:absolute; top:62px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.1);
  border-radius:20px; padding:5px 16px;
  display:flex; gap:14px; align-items:center;
  opacity:0; transition:opacity .4s;
}
#gyro-strip.show{opacity:1}
.gs-item { display:flex; flex-direction:column; align-items:center; gap:1px; }
.gs-lbl { color:rgba(255,255,255,.35); font-size:9px; letter-spacing:.5px; }
.gs-val { color:#6ec6ff; font-size:12px; font-weight:700; min-width:36px; text-align:center; }

/* Bottom bar */
.bot {
  position:absolute; bottom:0; left:0; right:0;
  padding:10px 20px 28px;
  background:linear-gradient(to top,rgba(0,0,0,.6),transparent);
  display:flex; align-items:center; justify-content:space-around;
  pointer-events:auto; opacity:0; transition:opacity .4s;
}
.bot.show{opacity:1}
.btn {
  background:rgba(255,255,255,.11); border:1px solid rgba(255,255,255,.2);
  color:#fff; font-size:13px; font-weight:600;
  padding:10px 20px; border-radius:24px; cursor:pointer;
}
.btn:active{transform:scale(.93);background:rgba(255,255,255,.22)}
.btn.p{background:linear-gradient(135deg,#6ec6ff,#a78bfa);border:none;color:#000;font-weight:800}

/* Color bar */
#cbar {
  position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
  display:flex; gap:10px; pointer-events:auto; opacity:0; transition:opacity .4s;
}
#cbar.show{opacity:1}
.cd {
  width:28px; height:28px; border-radius:50%; cursor:pointer;
  border:2.5px solid transparent; transition:transform .15s,border-color .15s;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.cd:active{transform:scale(1.25)}
.cd.active{border-color:#fff}

/* Hint toast */
.hint {
  position:absolute; bottom:118px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.7); border:1px solid rgba(255,255,255,.12);
  border-radius:24px; padding:8px 18px;
  color:rgba(255,255,255,.8); font-size:12px; white-space:nowrap;
  pointer-events:none; animation:hf 3.5s ease forwards;
}
@keyframes hf{0%{opacity:0;transform:translateX(-50%) translateY(6px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}75%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<div id="start-screen">
  <div class="orb"></div>
  <div class="s-title">Realidad Aumentada</div>
  <div class="s-sub">Tarea 3.2 · Giroscopio</div>
  <div class="s-desc">El objeto 3D queda <strong style="color:#6ec6ff">anclado en el espacio</strong>. Mueve el celular para verlo desde distintos ángulos.</div>
  <button class="s-btn" onclick="init()">🚀 Iniciar AR</button>
  <div class="s-note">Requiere Chrome · Cámara · Giroscopio</div>
</div>

<video id="cam" autoplay playsinline muted></video>
<canvas id="three-canvas"></canvas>

<div id="hud">
  <div class="top-bar">
    <span class="top-title">AR · Giroscopio</span>
    <span class="badge" id="badge">Iniciando...</span>
  </div>

  <div id="gyro-strip">
    <div class="gs-item"><span class="gs-lbl">GIRO α</span><span class="gs-val" id="va">0°</span></div>
    <div class="gs-item"><span class="gs-lbl">INCL β</span><span class="gs-val" id="vb">0°</span></div>
    <div class="gs-item"><span class="gs-lbl">LADO γ</span><span class="gs-val" id="vg">0°</span></div>
    <div class="gs-item"><span class="gs-lbl">FPS</span><span class="gs-val" id="fps">--</span></div>
  </div>

  <div class="xhair"><div class="xh-ring"></div><div class="xh-dot"></div></div>
  <div class="corners">
    <div class="cor tl"></div><div class="cor tr"></div>
    <div class="cor bl"></div><div class="cor br"></div>
  </div>

  <div id="cbar">
    <div class="cd active" style="background:#6ec6ff" onclick="setColor('#6ec6ff',this)"></div>
    <div class="cd" style="background:#a78bfa" onclick="setColor('#a78bfa',this)"></div>
    <div class="cd" style="background:#34d399" onclick="setColor('#34d399',this)"></div>
    <div class="cd" style="background:#f59e0b" onclick="setColor('#f59e0b',this)"></div>
    <div class="cd" style="background:#f87171" onclick="setColor('#f87171',this)"></div>
  </div>

  <div class="bot" id="bot">
    <button class="btn" onclick="togglePause(this)">⏸ Pausa</button>
    <button class="btn p" onclick="recenter()">Recentrar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Gyro state (raw + smoothed) ──
let rawA=0, rawB=0, rawG=0;
let smA=0, smB=0, smG=0;   // smoothed values
let alphaOffset=0;
let gyroReady=false;

// Smoothing factor: 0=no movement, 1=instant snap
// 0.06 = very smooth, 0.12 = responsive but not jittery
const SMOOTH = 0.07;

// ── Three.js ──
let renderer, scene, cam3d;
let mainMesh, ring1, ring2, orb1, orb2;
let paused=false;
let fpsCount=0, fpsLast=Date.now();
let t=0;

// ── Camera target (for smooth lerp) ──
let camTarget = new THREE.Vector3(0,0,3.5);
let camCurrent = new THREE.Vector3(0,0,3.5);

// ────────────────────────────────────────
async function init() {
  // Camera
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} },
      audio:false
    });
    const vid = document.getElementById('cam');
    vid.srcObject = stream;
    await vid.play();
  } catch(e) {
    alert('Error cámara: ' + e.message + '\n\nUsa Chrome con HTTPS (Netlify).');
    return;
  }

  // iOS gyro permission
  if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
    try { await DeviceOrientationEvent.requestPermission(); } catch(e) {}
  }

  window.addEventListener('deviceorientation', onGyro, { passive:true });

  buildScene();

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('badge').textContent = 'AR Activo ✓';
  document.getElementById('gyro-strip').classList.add('show');
  document.getElementById('cbar').classList.add('show');
  document.getElementById('bot').classList.add('show');

  hint('🌀 Mueve el celular para girar alrededor del objeto');
  requestAnimationFrame(loop);
}

// ────────────────────────────────────────
//  GYRO — only store raw values here, NO Three.js calls
// ────────────────────────────────────────
function onGyro(e) {
  if (e.alpha == null) return;
  rawA = e.alpha;
  rawB = e.beta;
  rawG = e.gamma;
  gyroReady = true;
}

// ────────────────────────────────────────
//  SCENE
// ────────────────────────────────────────
function buildScene() {
  const canvas = document.getElementById('three-canvas');
  renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0,0);

  scene = new THREE.Scene();

  cam3d = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 100);
  cam3d.position.set(0,0,3.5);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const pl1 = new THREE.PointLight(0x6ec6ff, 2.5, 12);
  pl1.position.set(3,3,3); scene.add(pl1);
  const pl2 = new THREE.PointLight(0xa78bfa, 1.8, 10);
  pl2.position.set(-3,-1,1); scene.add(pl2);

  // Main object — low poly for performance
  const geo = new THREE.IcosahedronGeometry(0.65, 0); // detail=0 = fastest
  mainMesh = new THREE.Mesh(geo,
    new THREE.MeshPhongMaterial({ color:0x6ec6ff, shininess:120, specular:0xffffff, transparent:true, opacity:0.92 })
  );
  scene.add(mainMesh);

  // Wireframe
  mainMesh.add(new THREE.Mesh(geo,
    new THREE.MeshBasicMaterial({ color:0xffffff, wireframe:true, transparent:true, opacity:0.08 })
  ));

  // Rings — reduced segments for perf
  ring1 = new THREE.Mesh(
    new THREE.TorusGeometry(1.05, 0.025, 6, 40),
    new THREE.MeshPhongMaterial({ color:0xa78bfa, transparent:true, opacity:0.7 })
  );
  ring1.rotation.x = Math.PI/2;
  scene.add(ring1);

  ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(0.82, 0.018, 6, 32),
    new THREE.MeshPhongMaterial({ color:0x34d399, transparent:true, opacity:0.55 })
  );
  ring2.rotation.set(Math.PI/3, Math.PI/5, 0);
  scene.add(ring2);

  // Orbiting spheres — minimal poly
  orb1 = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 8, 8),
    new THREE.MeshPhongMaterial({ color:0xf59e0b })
  );
  scene.add(orb1);

  orb2 = new THREE.Mesh(
    new THREE.SphereGeometry(0.07, 8, 8),
    new THREE.MeshPhongMaterial({ color:0xf87171 })
  );
  scene.add(orb2);

  window.addEventListener('resize', ()=>{
    cam3d.aspect = window.innerWidth/window.innerHeight;
    cam3d.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ────────────────────────────────────────
//  MAIN LOOP — gyro processing happens here, once per frame
// ────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  if (paused) return;
  t += 0.016;

  // ── Smooth gyro values (exponential moving average) ──
  if (gyroReady) {
    // Handle alpha wraparound (0↔360)
    let da = rawA - smA;
    if (da > 180) da -= 360;
    if (da < -180) da += 360;
    smA += da * SMOOTH;

    smB += (rawB - smB) * SMOOTH;
    smG += (rawG - smG) * SMOOTH;

    // Update UI only every 10 frames to reduce DOM work
    if (Math.round(t * 60) % 10 === 0) {
      document.getElementById('va').textContent = Math.round(smA) + '°';
      document.getElementById('vb').textContent = Math.round(smB) + '°';
      document.getElementById('vg').textContent = Math.round(smG) + '°';
    }

    // ── Move camera based on gyro ──
    // beta (X tilt): phone tilted forward/back → move camera up/down
    // gamma (Y tilt): phone tilted left/right → move camera left/right
    // alpha (compass): phone rotated → orbit horizontally
    const heading = THREE.MathUtils.degToRad(smA - alphaOffset);
    const tilt    = THREE.MathUtils.degToRad(smB - 90); // 90=upright
    const roll    = THREE.MathUtils.degToRad(smG);

    const R = 3.5;
    camTarget.x = R * Math.sin(heading) * Math.cos(tilt);
    camTarget.y = R * Math.sin(tilt) + roll * 0.5;
    camTarget.z = R * Math.cos(heading) * Math.cos(tilt);

    // Lerp camera position — smooth, no jank
    camCurrent.lerp(camTarget, 0.08);
    cam3d.position.copy(camCurrent);
    cam3d.lookAt(0, 0, 0);
  }

  // Object animations
  mainMesh.rotation.y += 0.006;
  mainMesh.rotation.x += 0.003;
  mainMesh.position.y = Math.sin(t * 0.9) * 0.13;

  ring1.rotation.z += 0.008;
  ring2.rotation.z -= 0.006;

  orb1.position.set(Math.cos(t * 0.7)*1.05, Math.sin(t*1.1)*0.22, Math.sin(t*0.7)*1.05);
  orb2.position.set(Math.cos(t*1.0+Math.PI)*0.82, Math.cos(t*0.8)*0.18, Math.sin(t*1.0+Math.PI)*0.82);

  // FPS
  fpsCount++;
  const now = Date.now();
  if (now - fpsLast > 1000) {
    document.getElementById('fps').textContent = fpsCount;
    fpsCount = 0; fpsLast = now;
  }

  renderer.render(scene, cam3d);
}

// ────────────────────────────────────────
//  UI
// ────────────────────────────────────────
function togglePause(btn) {
  paused = !paused;
  btn.textContent = paused ? '▶ Play' : '⏸ Pausa';
}

function recenter() {
  alphaOffset = rawA;
  hint('✓ Recentrado');
}

function setColor(hex, el) {
  if (mainMesh) mainMesh.material.color.set(hex);
  document.querySelectorAll('.cd').forEach(d=>d.classList.remove('active'));
  el.classList.add('active');
}

function hint(msg) {
  document.querySelectorAll('.hint').forEach(h=>h.remove());
  const d = document.createElement('div');
  d.className='hint'; d.textContent=msg;
  document.getElementById('hud').appendChild(d);
  setTimeout(()=>d.remove(), 4000);
}
</script>
</body>
</html>
