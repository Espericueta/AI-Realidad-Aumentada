<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>Tarea 3.2 — AR Realidad Aumentada</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; font-family:'Segoe UI',sans-serif; overflow:hidden; height:100dvh; }

  /* Camera feed fills screen */
  #cam {
    position:fixed; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:0;
  }

  /* Three.js canvas on top, transparent bg */
  #three-canvas {
    position:fixed; inset:0;
    width:100%; height:100%;
    z-index:1;
    pointer-events:none;
  }

  /* HUD */
  #hud {
    position:fixed; inset:0;
    z-index:10;
    pointer-events:none;
  }

  .top-bar {
    position:absolute; top:0; left:0; right:0;
    padding:14px 18px 10px;
    background:linear-gradient(to bottom,rgba(0,0,0,.65) 0%,transparent 100%);
    display:flex; align-items:center; justify-content:space-between;
  }
  .top-title { color:#fff; font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
  .badge {
    background:rgba(110,198,255,.18);
    border:1px solid rgba(110,198,255,.4);
    color:#6ec6ff; font-size:10px; font-weight:700;
    letter-spacing:1px; padding:3px 10px; border-radius:20px;
  }

  /* Crosshair */
  .crosshair {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:64px; height:64px;
  }
  .ch-ring {
    width:64px; height:64px;
    border:1.5px solid rgba(110,198,255,.7);
    border-radius:50%;
    animation:pulse 2s ease-in-out infinite;
  }
  .ch-dot {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:7px; height:7px;
    background:#6ec6ff; border-radius:50%;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.18);opacity:1} }

  /* Corner brackets */
  .corners {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:170px; height:170px;
  }
  .c { position:absolute; width:22px; height:22px; border-color:rgba(110,198,255,.5); border-style:solid; }
  .c.tl { top:0;left:0; border-width:2px 0 0 2px; }
  .c.tr { top:0;right:0; border-width:2px 2px 0 0; }
  .c.bl { bottom:0;left:0; border-width:0 0 2px 2px; }
  .c.br { bottom:0;right:0; border-width:0 2px 2px 0; }

  /* Status pill */
  #status-pill {
    position:absolute; bottom:110px; left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.7);
    border:1px solid rgba(255,255,255,.15);
    border-radius:24px; padding:8px 18px;
    color:#fff; font-size:12px;
    display:flex; align-items:center; gap:8px;
    white-space:nowrap;
  }
  .sdot {
    width:8px; height:8px; border-radius:50%;
    background:#f59e0b;
    animation:blink 1s ease infinite;
  }
  .sdot.on { background:#34d399; animation:none; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

  /* Bottom buttons */
  .bottom-bar {
    position:absolute; bottom:0; left:0; right:0;
    padding:12px 20px 30px;
    background:linear-gradient(to top,rgba(0,0,0,.65) 0%,transparent 100%);
    display:flex; align-items:center; justify-content:space-around;
    pointer-events:auto;
  }
  .btn {
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    color:#fff; font-size:13px; font-weight:600;
    padding:10px 22px; border-radius:24px; cursor:pointer;
    transition:background .2s, transform .1s;
  }
  .btn:active { transform:scale(.94); background:rgba(255,255,255,.25); }
  .btn.primary {
    background:linear-gradient(135deg,#6ec6ff,#a78bfa);
    border:none; color:#000;
  }

  /* Permission screen */
  #perm-screen {
    position:fixed; inset:0; z-index:999;
    background:linear-gradient(135deg,#0a0a1a,#0d1b2a);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:32px; text-align:center;
    transition:opacity .6s ease;
  }
  #perm-screen.hidden { opacity:0; pointer-events:none; }
  .perm-icon { font-size:64px; margin-bottom:20px; }
  .perm-title { color:#fff; font-size:22px; font-weight:700; margin-bottom:10px; }
  .perm-text { color:rgba(255,255,255,.55); font-size:14px; line-height:1.7; margin-bottom:32px; }
  .perm-btn {
    background:linear-gradient(135deg,#6ec6ff,#a78bfa);
    border:none; color:#000; font-size:16px; font-weight:700;
    padding:14px 36px; border-radius:32px; cursor:pointer;
    box-shadow:0 0 30px rgba(110,198,255,.3);
  }
  .perm-note { color:rgba(255,255,255,.3); font-size:11px; margin-top:16px; }

  /* Object info panel */
  #obj-panel {
    position:absolute; top:70px; right:14px;
    background:rgba(5,12,28,.85);
    border:1px solid rgba(167,139,250,.3);
    border-radius:14px; padding:14px 16px;
    min-width:148px;
    opacity:0; transform:translateX(16px);
    transition:all .4s ease;
    pointer-events:none;
  }
  #obj-panel.show { opacity:1; transform:translateX(0); }
  .panel-label { font-size:10px; color:#a78bfa; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
  .panel-val { font-size:14px; color:#fff; font-weight:700; margin-bottom:10px; }
  .panel-row { display:flex; justify-content:space-between; font-size:11px; color:rgba(255,255,255,.4); margin-bottom:3px; }

  /* Color picker */
  #color-bar {
    position:absolute; bottom:90px; left:50%;
    transform:translateX(-50%);
    display:flex; gap:10px; pointer-events:auto;
  }
  .color-dot {
    width:28px; height:28px; border-radius:50%;
    cursor:pointer; border:2px solid transparent;
    transition:transform .2s, border-color .2s;
  }
  .color-dot:active { transform:scale(1.2); }
  .color-dot.active { border-color:#fff; }
</style>
</head>
<body>

<!-- Permission screen -->
<div id="perm-screen">
  <div class="perm-icon">📷</div>
  <div class="perm-title">Activar Cámara AR</div>
  <div class="perm-text">
    Esta experiencia de Realidad Aumentada necesita acceso a tu cámara para superponer objetos 3D en el mundo real.
  </div>
  <button class="perm-btn" onclick="startCamera()">Activar Cámara</button>
  <div class="perm-note">Solo se usa localmente, no se graba ni se envía nada.</div>
</div>

<!-- Camera video element -->
<video id="cam" autoplay playsinline muted></video>

<!-- Three.js canvas -->
<canvas id="three-canvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="top-bar">
    <span class="top-title">AR · 3D Flotante</span>
    <span class="badge">Tarea 3.2</span>
  </div>

  <div class="crosshair">
    <div class="ch-ring"></div>
    <div class="ch-dot"></div>
  </div>
  <div class="corners">
    <div class="c tl"></div><div class="c tr"></div>
    <div class="c bl"></div><div class="c br"></div>
  </div>

  <div id="obj-panel">
    <div class="panel-label">Objeto AR</div>
    <div class="panel-val">Icosaedro 3D</div>
    <div class="panel-row"><span>Framework</span><span>Three.js</span></div>
    <div class="panel-row"><span>Animación</span><span>Activa ✓</span></div>
    <div class="panel-row"><span>FPS</span><span id="fps-val">--</span></div>
  </div>

  <div id="status-pill">
    <div class="sdot" id="sdot"></div>
    <span id="slabel">Iniciando cámara...</span>
  </div>

  <!-- Color selector -->
  <div id="color-bar">
    <div class="color-dot active" style="background:#6ec6ff" onclick="setColor('#6ec6ff',this)"></div>
    <div class="color-dot" style="background:#a78bfa" onclick="setColor('#a78bfa',this)"></div>
    <div class="color-dot" style="background:#34d399" onclick="setColor('#34d399',this)"></div>
    <div class="color-dot" style="background:#f59e0b" onclick="setColor('#f59e0b',this)"></div>
    <div class="color-dot" style="background:#f87171" onclick="setColor('#f87171',this)"></div>
  </div>

  <div class="bottom-bar">
    <button class="btn" onclick="togglePanel()">Info</button>
    <button class="btn" onclick="toggleAnimation()">⏸ Pausa</button>
    <button class="btn primary" onclick="resetObject()">Reset</button>
  </div>
</div>

<!-- Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ─────────────────────────────────────────
//  CAMERA
// ─────────────────────────────────────────
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' }, // back camera
        width:  { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    const video = document.getElementById('cam');
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      document.getElementById('perm-screen').classList.add('hidden');
      document.getElementById('sdot').classList.add('on');
      document.getElementById('slabel').textContent = 'Cámara activa ✓';
      document.getElementById('obj-panel').classList.add('show');
      initThree();
    };
  } catch(e) {
    document.getElementById('slabel').textContent = 'Error: ' + e.message;
    alert('No se pudo acceder a la cámara.\n\nAsegúrate de:\n1. Abrir en Chrome\n2. Aceptar el permiso de cámara\n3. Usar HTTPS (Netlify URL)');
  }
}

// ─────────────────────────────────────────
//  THREE.JS SCENE
// ─────────────────────────────────────────
let scene, camera3d, renderer, animating = true;
let mainMesh, ring1, ring2, orb1, orb2, particles;
let currentColor = '#6ec6ff';
let fpsCounter = 0, fpsLast = Date.now();

function initThree() {
  const canvas = document.getElementById('three-canvas');

  // Renderer — transparent so camera shows through
  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0); // fully transparent

  // Scene
  scene = new THREE.Scene();

  // Camera
  camera3d = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
  camera3d.position.set(0, 0, 3.5);

  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambient);

  const light1 = new THREE.PointLight(0x6ec6ff, 2, 10);
  light1.position.set(2, 3, 2);
  scene.add(light1);

  const light2 = new THREE.PointLight(0xa78bfa, 1.5, 10);
  light2.position.set(-2, -1, 1);
  scene.add(light2);

  const light3 = new THREE.DirectionalLight(0xffffff, 0.8);
  light3.position.set(0, 5, 5);
  scene.add(light3);

  // ── Main object: Icosahedron ──
  const geo = new THREE.IcosahedronGeometry(0.6, 1);
  const mat = new THREE.MeshPhongMaterial({
    color: new THREE.Color(currentColor),
    shininess: 120,
    specular: new THREE.Color(0xffffff),
    transparent: true,
    opacity: 0.92
  });
  mainMesh = new THREE.Mesh(geo, mat);
  scene.add(mainMesh);

  // Wireframe overlay
  const wireMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, wireframe: true, transparent: true, opacity: 0.08
  });
  const wireMesh = new THREE.Mesh(geo, wireMat);
  mainMesh.add(wireMesh);

  // ── Ring 1 ──
  const ringGeo = new THREE.TorusGeometry(1.05, 0.025, 8, 64);
  const ringMat = new THREE.MeshPhongMaterial({ color: 0xa78bfa, transparent: true, opacity: 0.75 });
  ring1 = new THREE.Mesh(ringGeo, ringMat);
  ring1.rotation.x = Math.PI / 2;
  scene.add(ring1);

  // ── Ring 2 ──
  const ring2Geo = new THREE.TorusGeometry(0.85, 0.018, 8, 64);
  const ring2Mat = new THREE.MeshPhongMaterial({ color: 0x34d399, transparent: true, opacity: 0.6 });
  ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
  ring2.rotation.x = Math.PI / 3;
  ring2.rotation.y = Math.PI / 5;
  scene.add(ring2);

  // ── Orbiting spheres ──
  const orbGeo = new THREE.SphereGeometry(0.1, 16, 16);

  orb1 = new THREE.Mesh(orbGeo, new THREE.MeshPhongMaterial({ color: 0xf59e0b, shininess: 200 }));
  scene.add(orb1);

  orb2 = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16),
    new THREE.MeshPhongMaterial({ color: 0xf87171, shininess: 200 }));
  scene.add(orb2);

  // ── Particle field ──
  const pCount = 120;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(pCount * 3);
  for (let i = 0; i < pCount * 3; i++) {
    pPos[i] = (Math.random() - 0.5) * 6;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pMat = new THREE.PointsMaterial({ color: 0x6ec6ff, size: 0.03, transparent: true, opacity: 0.5 });
  particles = new THREE.Points(pGeo, pMat);
  scene.add(particles);

  // Resize handler
  window.addEventListener('resize', () => {
    camera3d.aspect = window.innerWidth / window.innerHeight;
    camera3d.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Touch / click to interact
  document.getElementById('three-canvas').style.pointerEvents = 'auto';
  document.getElementById('three-canvas').addEventListener('click', onTap);

  animate();
}

// ─────────────────────────────────────────
//  ANIMATION LOOP
// ─────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  if (!animating) return;

  t += 0.016;

  // Main object rotation
  mainMesh.rotation.x += 0.008;
  mainMesh.rotation.y += 0.014;

  // Floating motion
  mainMesh.position.y = Math.sin(t * 0.9) * 0.18;

  // Rings rotation
  ring1.rotation.z += 0.009;
  ring2.rotation.z -= 0.006;
  ring2.rotation.x += 0.004;

  // Orbiting spheres
  orb1.position.x = Math.cos(t * 0.8) * 1.05;
  orb1.position.z = Math.sin(t * 0.8) * 1.05;
  orb1.position.y = Math.sin(t * 1.4) * 0.3;

  orb2.position.x = Math.cos(t * 1.1 + Math.PI) * 0.85;
  orb2.position.z = Math.sin(t * 1.1 + Math.PI) * 0.85;
  orb2.position.y = Math.cos(t * 0.9) * 0.25;

  // Particles slow drift
  particles.rotation.y += 0.001;
  particles.rotation.x += 0.0005;

  // FPS counter
  fpsCounter++;
  const now = Date.now();
  if (now - fpsLast > 1000) {
    document.getElementById('fps-val').textContent = fpsCounter;
    fpsCounter = 0;
    fpsLast = now;
  }

  renderer.render(scene, camera3d);
}

// ─────────────────────────────────────────
//  UI CONTROLS
// ─────────────────────────────────────────
function togglePanel() {
  document.getElementById('obj-panel').classList.toggle('show');
}

function toggleAnimation() {
  animating = !animating;
  const btn = event.target;
  btn.textContent = animating ? '⏸ Pausa' : '▶ Play';
}

function resetObject() {
  if (!mainMesh) return;
  mainMesh.scale.set(0.01, 0.01, 0.01);
  let s = 0.01;
  const grow = setInterval(() => {
    s = Math.min(s + 0.06, 1);
    mainMesh.scale.set(s, s, s);
    if (s >= 1) clearInterval(grow);
  }, 16);
}

function setColor(hex, el) {
  currentColor = hex;
  if (mainMesh) {
    mainMesh.material.color.set(hex);
  }
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
}

function onTap(e) {
  if (!mainMesh) return;
  // Scale bounce on tap
  mainMesh.scale.set(1.3, 1.3, 1.3);
  setTimeout(() => mainMesh.scale.set(1, 1, 1), 200);
}
</script>
</body>
</html>
